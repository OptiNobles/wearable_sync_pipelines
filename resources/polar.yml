resources:
  schemas:
    # Silver schema for Polar data (in dev mode: dev_<user>_polar).
    polar:
      catalog_name: ${var.silver_catalog}
      name: polar
      comment: Cleaned, typed Polar data parsed from bronze.

    # Gold schema for body metrics (in dev mode: dev_<user>_body).
    body:
      catalog_name: ${var.gold_catalog}
      name: body
      comment: Body metrics over time (weight, VO2max), ready for dashboards.

    # Gold schema for training metrics (in dev mode: dev_<user>_training).
    training:
      catalog_name: ${var.gold_catalog}
      name: training
      comment: Runs, their distance profiles and splits, and activity per period, ready for dashboards.

  volumes:
    # Auto Loader state (which bronze files were already processed).
    checkpoints:
      catalog_name: ${var.silver_catalog}
      schema_name: ${resources.schemas.polar.name}
      name: checkpoints
      volume_type: MANAGED
      comment: Auto Loader checkpoints of the silver task of the wearable_sync_polar job.

  jobs:
    # Keys are unique across resource types, and the schema key 'polar' must stay:
    # renaming it would drop and re-create the silver schema.
    wearable_sync_polar:
      name: wearable_sync_polar

      # Lets system.billing.usage attribute the job's cost to the project, like the
      # tags on the Azure resources.
      tags:
        project: wearable_sync

      # Runs when wearable_sync writes new files to bronze (evening sync), instead of
      # on a fixed schedule. Paused automatically in dev mode.
      trigger:
        file_arrival:
          url: ${var.bronze_volume_path}/
          min_time_between_triggers_seconds: 300
          # Wait until the sync has finished writing all of its files.
          wait_after_last_change_seconds: 120

      # Nobody waits for a nightly run: standard mode starts in 4-6 minutes instead of
      # under one, and uses fewer DBUs.
      performance_target: STANDARD

      max_concurrent_runs: 1

      tasks:
        - task_key: silver
          python_wheel_task:
            package_name: wearable_sync_pipelines
            entry_point: silver-polar
            parameters:
              - --bronze-path
              - ${var.bronze_volume_path}
              - --catalog
              - ${var.silver_catalog}
              - --schema
              - ${resources.schemas.polar.name}
              - --checkpoint-path
              - /Volumes/${var.silver_catalog}/${resources.schemas.polar.name}/${resources.volumes.checkpoints.name}
          environment_key: default

        - task_key: gold
          depends_on:
            - task_key: silver
          # Also after a failed silver task: silver fails on purpose when a file is
          # quarantined, but the other files are merged and should reach gold. Gold
          # reflects whatever silver holds; if silver stopped partway, gold may miss
          # part of that run until the next run, which rebuilds gold in full.
          run_if: ALL_DONE
          python_wheel_task:
            package_name: wearable_sync_pipelines
            entry_point: gold-polar
            parameters:
              - --silver-catalog
              - ${var.silver_catalog}
              - --silver-schema
              - ${resources.schemas.polar.name}
              - --gold-catalog
              - ${var.gold_catalog}
              - --body-schema
              - ${resources.schemas.body.name}
              - --training-schema
              - ${resources.schemas.training.name}
              - --timezone
              - ${var.timezone}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            # Serverless environment version 6: Python 3.12.
            environment_version: "6"
            dependencies:
              - ../dist/*.whl
