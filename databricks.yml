# Databricks Asset Bundle: bronze -> silver -> gold pipelines for wearable_sync data.
#
# The workspace URL is not stored here (the repository is public): it comes from the
# DATABRICKS_HOST environment variable or the default profile in ~/.databrickscfg.
bundle:
  name: wearable_sync_pipelines

include:
  - resources/*.yml

artifacts:
  wheel:
    type: whl
    build: uv build --wheel

variables:
  bronze_volume_path:
    description: Raw files written by wearable_sync (read only).
    default: /Volumes/wearable_sync_bronze/polar/files
  silver_catalog:
    default: wearable_sync_silver
  gold_catalog:
    default: wearable_sync_gold
  timezone:
    description: Time zone of local dates in gold (IANA name).
    default: Europe/Warsaw
  run_as_service_principal:
    description: >-
      Application ID of the service principal that deploys and runs the prod target
      (id-wearable-sync-pipelines; in pull request validation, the CI identity).
      Set by CI through BUNDLE_VAR_run_as_service_principal. No default: the prod
      target fails fast when it is missing.

targets:
  dev:
    # Development mode: resources get a 'dev_<user>_' / '[dev <user>]' prefix,
    # triggers are paused, and everything runs as the deploying user.
    mode: development
    default: true
    variables:
      # dev runs as the deploying user; the CLI still requires every variable to
      # have a value in every target.
      run_as_service_principal: not-used-in-dev

  prod:
    # Production mode: no name prefixes, active triggers, and deployment checks
    # (e.g. no development clusters). Deployed only by CI from main.
    mode: production
    workspace:
      # One fixed location, owned by the deploying/run_as service principal, so only
      # one copy of the prod bundle can ever exist.
      root_path: /Workspace/Users/${var.run_as_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
